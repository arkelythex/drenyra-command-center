# OpenSpec Configuration — ARKELYTHEX Drenyra
# Creado: 2026-07-02
# Modo: agentic-first transformation (10 SDD plans: 6 frontend + 4 backend)

version: '1.0'
project: '@arkelythex/main'

# SDD session preflight choices (2026-07-02)
execution_mode: interactive
artifact_store: both # openspec + engram cuando disponible
chained_pr_strategy: auto-forecast
review_budget: 400 # líneas máximas por PR individual

# Estrategia general
strategy: dual-track # Frontend agentic UX + Backend production readiness
migration: replace-total # Reemplazo completo de navegación SaaS → agentic

# Equipo / autores
authors:
  - el-gentleman
  - equipo-frontend

# Monorepo workspace
workspace:
  root: /home/dreamcoder08/Documents/PROYECTOS/Drenyra
  apps:
    - apps/web # React SPA
    - apps/api # Elysia API
    - apps/data-engine # Python + Polars
    - apps/drenyra-cli # Go CLI
    - apps/landing # Next.js
  packages:
    - packages/domain
    - packages/application
    - packages/persistence
    - packages/infrastructure
    - packages/ai
    - packages/drenyra-orchestrator
    - packages/ui
    - packages/shared
    - packages/drenyra-core
    - packages/drenyra-engram

