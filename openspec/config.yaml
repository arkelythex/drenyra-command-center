# Allowed edit roots for SDD phases
allowed_edit_roots:
  roots:
    - openspec/ # SDD artifacts (config, specs, changes)
    - docs/ # product/architecture docs (keep in sync with changes)
    - .atl/skill-registry.md # project skill registry (update only when explicitly intended)
    - worktrees/<task-name>/ # implementation happens in isolated worktrees per AGENTS.md
  constraints:
    - "Planning phases must not modify product source (apps/, packages/, engines/, services/, contracts/, country-packs/), dependencies (bun.lock, package manifests), or runtime configuration (.env, docker-compose.yml)"
    - "No writes outside the Drenyra repo: sibling repos drenyra-ai, drenyra-engram, drenyra-pi are owned by their own repositories and coordinated from here, never edited from Drenyra phases"

# Ecosystem umbrella fact (user-approved context)
ecosystem:
  umbrella_program: true
  description: "Drenyra is the umbrella/coordinating program — the Accounting Command Center visual surface. It coordinates three related private repositories without owning their codebases: drenyra-ai (verifiable accounting agent OS / RDA protocol runtime), drenyra-engram (institutional accounting memory), drenyra-pi (Pi-native accounting operations harness)."
  repos:
    - name: drenyra-ai
      role: "accounting agent OS — RDA protocol, missions, receipts (Ed25519), candidates, gates, ledger, recovery"
      relation: "consumed via GitHub Release tarballs (e.g. v0.1.0); Drenyra keeps adapter shims, never a second authority"
    - name: drenyra-engram
      role: "institutional accounting memory — policies, criteria, approved decisions with provenance and company isolation"
      relation: "separate repo (docs/14-design/product-topology.md)"
    - name: drenyra-pi
      role: "Pi-native harness executing the RDA protocol — accounting persona, context panel, specialized agents, skills, safety guards"
      relation: "separate repo (docs/14-design/product-topology.md)"
  integration_rules: "docs/14-design/ecosystem-capability-matrix.md — once Drenyra consumes a released capability, the internal copy is removed or becomes an adapter; never a second authority"
  boundary:
    "Ecosystem-wide production/audit-readiness planning is coordinated from this repo; no writes land in sibling repos from Drenyra phases"

