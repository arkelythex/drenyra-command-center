# Test commands (detected from root package.json, turbo.json, Makefile, bunfig.toml)
test:
  runner: bun # Bun 1.3.11
  strict_tdd: true # inherited from strict_tdd above; enforced by OpenSpec conventions
  commands:
    - "bun run test"
    - "bun run turbo:test"
    - "bun run typecheck"
    - "bun run turbo:typecheck"
    - "bun run lint"
    - "make test"
    - "make typecheck"
    - "make lint"
    - "make go-test"
    - "make quality"
    - "cd apps/data-engine && pytest"
    - "bun run test --filter <pkg>"
  tooling:
    unit: "vitest (28 packages) + @fast-check/vitest property-based tests"
    e2e: "Playwright (e2e/)"
    go: "go test ./... via make go-test (golangci-lint optional, go vet fallback)"
    python: "pytest (apps/data-engine, products/andino)"
    coverage: "per-package; bunfig [test] coverage = false by default"

# Repository conventions (from AGENTS.md, CLAUDE.md, CODEX-MAP.md, docs/01-foundation/)
conventions:
  doc_taxonomy:
    [SDD, ADR, FSD, WSD, ASD, Contract Specs, Threat Models, Runbooks]
  rules: "AGENTS.md (root engineering rules), CLAUDE.md"
  skill_registry: ".atl/skill-registry.md (present, 18+ project skills)"
  navigation: "CODEX-MAP.md + .codebase/index.yml (bun run codebase:index / :check)"
  architecture: "vertical slice + CQRS; hexagonal (domain -> application -> infrastructure); Elysia is an input adapter only"
  fiscal_safety: "fiscal correctness, tenant/RUC isolation, auditability are product safety requirements; Money value object only (no floats/raw numbers for money); no `any`; branded IDs for money-sensitive data"
  sdd_rule: "no new SDD until a capability is near implementation; Capability Map owns the vision; SDD Audit tracks maturity"
  git: "dedicated branch per change; isolated worktree for medium/large/fiscal/SUNAT/DB/AI-control/CI work under worktrees/<task-name>; keep main clean"
  delivery: "changes over 400 lines must pick ask-on-risk | auto-chain | single-pr | exception-ok and document it in the PR body"
  docs_required: "update docs when public behavior, setup, contracts, or fiscal assumptions change"

