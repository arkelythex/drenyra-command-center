app = "arkelythex-api"
primary_region = "bog"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "./Dockerfile.production"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  OTEL_SERVICE_NAME = "arkelythex-api"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
