# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - misspell
    - revive
    - bodyclose
    - prealloc
    - unconvert
    - noctx

linters-settings:
  staticcheck:
    checks:
      - 'all'
      - '-SA1019'
  revive:
    rules:
      - name: exported
        severity: warning
      - name: error-return
      - name: blank-imports
        severity: warning

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
        - noctx
        - bodyclose
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
