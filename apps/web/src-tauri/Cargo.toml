[package]
name = "drenyra-desktop"
version = "0.1.0"
description = "Drenyra Operational Workbench — Desktop Shell"
authors = ["Drenyra Team"]
edition = "2021"

[lib]
name = "drenyra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
