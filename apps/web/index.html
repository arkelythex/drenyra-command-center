<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drenyra | Sistema Cognitivo Financiero</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f0f12" />
    <link rel="dns-prefetch" href="/api" />
    <link rel="preconnect" href="/api" />

    <!-- Anti-FOUC: Apply theme before React hydrates to prevent flash -->
    <script>
      ;(() => {
        try {
          var stored = localStorage.getItem('drenyra-ui-storage')
          var mode = stored ? JSON.parse(stored).state?.uxMode : 'dark'
          var isDark = mode === 'dark' || mode === 'cyberpunk'
          if (mode === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          }
          document.documentElement.classList.add(isDark ? 'dark' : 'light')
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (_e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <!-- Self-hosted fonts (subset Latin WOFF2 via fontsource) -->
    <link
      rel="preload"
      href="/fonts/geist-mono/geist-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter/inter-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
