# ARKALYTHIX Web SPA — Nginx Configuration
# Serves the built React SPA from /usr/share/nginx/html
# Designed for Docker container deployment

server {
    # HTTP port for the container — standard nginx default
    listen 80;

    # Matches any host header in Docker; change to your domain in production
    server_name localhost;

    # Built SPA assets directory — Dockerfile copies the compiled app here
    root /usr/share/nginx/html;

    # Entry point for all requests — Angular/React Router needs index.html
    index index.html;

    # SPA Fallback Pattern
    # try_files attempts to serve the exact URI, then the directory,
    # and finally falls back to /index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy for API (commented out — currently using absolute URLs via env)
    # Uncomment and configure if you need relative API paths or CORS workaround:
    #
    # location /api {
    #     # Proxy to the API container/service name defined in docker-compose
    #     proxy_pass http://api:3000;
    #
    #     # Preserve original host and client IP
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #
    #     # Enable WebSocket support if needed
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }
}
