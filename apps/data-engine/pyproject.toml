[project]
name = "drenyra-data-engine"
version = "0.1.0"
description = "High-performance Financial Data Processing Engine (Polars + Rust Stack)"
authors = [{name = "Drenyra Team", email = "dev@arkalythix.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "polars>=0.20.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "orjson>=3.9.15", # Faster JSON parsing (Rust)
    # ML/Analytics (optional)
    "scikit-learn>=1.4.0", # For cashflow forecasting
    "numpy>=1.26.0", # Numerical operations
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "black>=24.0.0", # Optional if using Ruff formatter
]
ocr = [
    "paddleocr>=3.0.0",
    "PyMuPDF>=1.24.0",
    "opencv-python-headless>=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- RUFF CONFIGURATION (The Rust Linter) ---
[tool.ruff]
line-length = 100
target-version = "py311"
pythonpath = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP",
    "TCH",  # flake8-type-checking
    "SIM",  # flake8-simplify
]

per-file-ignores = {"tests/*" = ["TCH"]}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "cryptography>=49.0.0",
    "pytest>=9.0.3",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/**"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "coverage"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "sire_bench: SIRE-bench golden regression tests for deterministic fiscal processing",
]
testpaths = ["tests"]

[tool.uv]
# Resolution window extended so the lockfile can admit pillow 12.3.0 (patched for
# CVE-2026-54058/54059/54060, 55379/55380, 59197/59199/59200, 59204/59205), which was
# uploaded on 2026-07-01. Everything else in uv.lock stays pinned as before.
exclude-newer = "2026-07-02T00:00:00Z"
