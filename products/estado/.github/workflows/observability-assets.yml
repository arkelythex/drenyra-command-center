name: Observability Assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: observability-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate observability assets
        run: bash ./scripts/validate-observability-assets.sh
