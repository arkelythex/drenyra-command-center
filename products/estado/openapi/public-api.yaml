openapi: 3.0.3
info:
  title: CivicTech Peru Public API
  version: 0.1.0
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /health:
    get:
      summary: Healthcheck
      responses:
        "200":
          description: OK

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        "200":
          description: OK

  /public/datasets:
    get:
      summary: List datasets
      responses:
        "200":
          description: OK

  /public/expenses:
    get:
      summary: Query expenses
      parameters:
        - in: query
          name: entity
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK

  /reports:
    post:
      summary: Create report draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description]
              properties:
                category:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Created

  /reports/{id}/evidence:
    post:
      summary: Upload evidence metadata and obtain presigned upload flow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                content_type:
                  type: string
                sha256:
                  type: string
      responses:
        "200":
          description: OK

  /reports/{id}/submit:
    post:
      summary: Submit report draft for moderation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "409":
          description: Invalid transition from current report state

  /moderation/cases/{id}/triage:
    post:
      summary: Move report from SUBMITTED to TRIAGED
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "409":
          description: Invalid transition from current report state

  /moderation/cases/{id}/verify:
    post:
      summary: Move report from TRIAGED to VERIFIED
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "409":
          description: Invalid transition from current report state

  /moderation/reports/{id}/publish:
    post:
      summary: Publish verified report with redacted text
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_text]
              properties:
                public_text:
                  type: string
      responses:
        "200":
          description: OK
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "409":
          description: Invalid transition from current report state

  /public/reports:
    get:
      summary: List published redacted reports
      responses:
        "200":
          description: OK

  /admin/ingest/demo:
    post:
      summary: Run demo CSV ingestion for transparency MVP
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
