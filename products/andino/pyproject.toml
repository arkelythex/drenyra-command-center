[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "andinodronelab"
version = "0.1.0"
description = "Agentic AI platform for drone engineering evolution"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.25.0",      # CLI framework (fastapi/typer ⭐19.5K)
    "rich>=15.0.0",       # Terminal formatting (textualize/rich ⭐56.6K)
    "pydantic>=2.0.0",    # Data validation (pydantic/pydantic ⭐22K+)
    "deap>=1.4.0",        # Evolutionary algorithms, NSGA-II (DEAP/deap ⭐6.4K)
]
dynamic = ["readme"]

[tool.setuptools.dynamic]
readme = {file = "README.md"}

[tool.setuptools.packages.find]
include = ["orchestrator*", "agent*", "morphology*"]

[project.scripts]
andino = "orchestrator.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
