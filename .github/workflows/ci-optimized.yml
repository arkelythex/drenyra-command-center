name: CI Optimized (non-PR)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Workflow-specific group key to avoid cross-workflow cancellation.
concurrency:
  group: ci-optimized-non-pr-${{ github.ref }}
  cancel-in-progress: true

# Optimize CI with smart caching and parallelization
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Job 1: Lint & Type Check (fastest - runs first)
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    
    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/bun.lock', '**/bun.lockb', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-
            
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Run ESLint
        run: bun run lint

      - name: Run ESLint design-tokens plugin (money formatting, brand colors, typography)
        run: bun run lint:design-tokens

      - name: Run Biome check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="${{ github.event.before }}"
            if [[ -z "${BASE_REF}" || "${BASE_REF}" =~ ^0+$ ]]; then
              echo "No previous commit available for this push; skipping changed-file Biome baseline"
              exit 0
            fi
            git fetch origin "${BASE_REF}" --depth=1 || true
            if ! git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
              echo "Could not resolve previous commit ${BASE_REF}; skipping changed-file Biome baseline"
              exit 0
            fi
          fi

          mapfile -t BIOME_FILES < <(
            git diff --name-only --diff-filter=ACMRT "${BASE_REF}"...HEAD -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.jsonc' '*.css' \
              | grep -v '^docs/' || true
          )

          if [[ "${#BIOME_FILES[@]}" -eq 0 ]]; then
            echo "✅ No Biome-supported changed files"
            exit 0
          fi

          bunx --package @biomejs/biome@2.3.11 biome check "${BIOME_FILES[@]}"

      - name: Run TypeScript compiler
        run: bun run typecheck

      - name: Verify API features covered by tsconfig.check
        run: bun run architecture:check-tsconfig-features

      - name: Enforce workspace package boundaries
        run: bun run architecture:check-boundaries

      - name: Enforce framework isolation (core/domain)
        run: bun run architecture:check-framework-isolation

      - name: Enforce Bun/Elysia/TanStack stack alignment
        run: bun run architecture:check-stack

      - name: Enforce product surface registry
        run: bun run architecture:check-product-surfaces

  # Job 2: Unit Tests (can run in parallel with lint)
  test:
    name: Unit Tests
    runs-on: [self-hosted, linux, x64]
    needs: []
    
    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
            
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Run tests
        env:
          VITEST_MAX_WORKERS: "1"
        run: |
          bun run --filter @arkelythex/api test:run
          bun run --filter @arkelythex/web test -- --run

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: apps/**/coverage

  # Job 3: Security Audit (critical - blocks merge)
  security:
    name: Security Audit
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
          
      - name: Run security audit
        run: bun run security:audit

  # Job 4: Build
  build:
    name: Build
    runs-on: [self-hosted, linux, x64]
    needs: [lint-and-typecheck]
    
    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
            
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Build Web (Turborepo)
        run: bunx turbo run build --filter=@arkelythex/web

      - name: Check bundle size budget
        run: bun run --filter @arkelythex/web check:bundle

  # Job 5: Gitleaks Secret Scanning
  gitleaks:
    name: Gitleaks Secret Scanning
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
      - name: Clear stale Gitleaks installer temp file
        run: |
          if [[ -f /tmp/gitleaks.tmp || -L /tmp/gitleaks.tmp ]]; then
            unlink /tmp/gitleaks.tmp
          fi

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Docker self-hosted runners expose HOME as /root while the repo lives
          # under /runner/_work, which makes the action's internal artifact upload
          # fail after a successful scan (`rootDirectory: /root is not a parent`).
          # Keep the scan blocking on real leaks, but skip the action-managed SARIF artifact.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Job 6: Migration Check
  migration-check:
    name: Migration Check
    runs-on: [self-hosted, linux, x64]
    needs: [lint-and-typecheck]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arkelythex_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432
    
    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
            
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/arkelythex_test
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d arkelythex_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          bun run --filter @arkelythex/infrastructure db:push

  # Job 7: DB Integration Tests (matches canonical CI database bootstrap)
  db-integration-tests:
    name: DB Integration Tests
    runs-on: [self-hosted, linux, x64]
    needs: [lint-and-typecheck]
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arkelythex_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp

    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify Bun runtime
        run: |
          command -v bun
          bun --version

      - name: Verify self-hosted native deps
        run: bash scripts/ci/verify-self-hosted-runner-host.sh native-deps
          
      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/arkelythex_test
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d arkelythex_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          bun run --filter @arkelythex/infrastructure db:push

      - name: Run DB integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/arkelythex_test
          BETTER_AUTH_SECRET: ci-better-auth-secret-min-32-chars-arkelythex
          BETTER_AUTH_URL: http://localhost
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost,http://localhost:3000,http://127.0.0.1
          VITEST_MAX_WORKERS: "1"
        run: bun run --filter @arkelythex/api test:db

  # Job 8: Supervisor review E2E (mismo workflow reutilizable que ci.yml)
  e2e-supervisor-review:
    uses: ./.github/workflows/reusable-e2e-supervisor-review.yml
    secrets: inherit

  # Job 9: Status Check (required for merge)
  all-checks-passed:
    name: All Checks Passed
    runs-on: [self-hosted, linux, x64]
    needs: [lint-and-typecheck, test, build, security, gitleaks, migration-check, db-integration-tests, e2e-supervisor-review]
    if: always()
    
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.gitleaks.result }}" != "success" ]] || \
             [[ "${{ needs.migration-check.result }}" != "success" ]] || \
             [[ "${{ needs.db-integration-tests.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-supervisor-review.result }}" != "success" ]]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All checks passed!"

      - name: Success message
        if: success()
        run: echo "🎉 All CI checks passed! Ready to merge."