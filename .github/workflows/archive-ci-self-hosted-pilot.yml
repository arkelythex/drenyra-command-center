name: CI/CD Pipeline (Self-Hosted Pilot)

on:
  workflow_dispatch:
  push:
    branches:
      - ci/self-hosted-cicd-pilot

permissions:
  contents: read

concurrency:
  group: ci-self-hosted-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-preflight:
    name: Runner Preflight
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show runner context
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          echo "GitHub ref: $GITHUB_REF"

      - name: Verify Docker access for service containers
        run: |
          docker --version
          docker ps >/dev/null

      - name: Verify Docker bridge networking
        run: |
          docker run --rm busybox true

      - name: Verify native build prerequisites
        run: |
          missing_packages=()
          for pkg in libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev; do
            if ! dpkg -s "$pkg" >/dev/null 2>&1; then
              missing_packages+=("$pkg")
            fi
          done

          if [ "${#missing_packages[@]}" -gt 0 ]; then
            echo "Missing native packages required by the current CI workflow: ${missing_packages[*]}"
            echo "Install them on the runner host before promoting the full CI pipeline to self-hosted."
            exit 1
          fi

      - name: Verify dependency bootstrap
        run: |
          bun --version
          bun install --frozen-lockfile

  lint-and-typecheck:
    name: Lint & Type Check (Pilot)
    runs-on: [self-hosted, linux, x64]
    needs: runner-preflight

    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript compiler
        run: bun run typecheck

  db-integration-tests:
    name: DB Integration Tests (Pilot)
    runs-on: [self-hosted, linux, x64]
    needs: runner-preflight

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arkelythex_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DB integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arkelythex_test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || 'http://localhost:3000' }}
        run: bun run --filter @arkelythex/api test:db

  summary:
    name: CI Summary (Pilot)
    runs-on: [self-hosted, linux, x64]
    needs: [runner-preflight, lint-and-typecheck, db-integration-tests]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "## ✅ Self-Hosted CI Pilot Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This pilot validates whether the current CI pipeline can be promoted from GitHub-hosted to a Linux x64 self-hosted runner." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Pilot checks:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner Docker/service-container readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native package readiness for build/test tasks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint + typecheck bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "- DB integration workflow viability on self-hosted infrastructure" >> "$GITHUB_STEP_SUMMARY"