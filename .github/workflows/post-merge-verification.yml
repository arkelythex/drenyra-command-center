# Post-Merge Verification — Feedback Loop
#
# After each merge to main, runs a verification agent that:
# 1. Captures the merge diff and identifies affected subsystems
# 2. Runs targeted checks (typecheck, tests, lint) on affected code
# 3. Records verification result as a GitHub issue for future improvement
# 4. If checks fail, creates a remediation issue for auto-remediation
#
# This closes the feedback loop: every change is verified
# and the result feeds back into the system.

name: Post-Merge Verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to verify (optional)"
        required: false
        type: number

concurrency:
  group: post-merge-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  BUN_VERSION: '1.3.11'

jobs:
  detect:
    name: Detect affected subsystems
    runs-on: ubuntu-latest
    outputs:
      run_go: ${{ steps.changes.outputs.go }}
      run_web: ${{ steps.changes.outputs.web }}
      run_api: ${{ steps.changes.outputs.api }}
      run_scripts: ${{ steps.changes.outputs.scripts }}
      changed_files: ${{ steps.changes.outputs.files }}
      insertions: ${{ steps.changes.outputs.insertions }}
      deletions: ${{ steps.changes.outputs.deletions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          OUTFILE="$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
            STAT=$(git diff --stat HEAD^ HEAD 2>/dev/null || echo "0 files changed")
            INS=$(echo "$STAT" | grep -oP '\d+(?= insertion)' || echo "0")
            DEL=$(echo "$STAT" | grep -oP '\d+(?= deletion)' || echo "0")
            echo "insertions=$INS"
            echo "deletions=$DEL"
            if echo "$FILES" | grep -qE '^apps/cli/'; then echo "go=true"; else echo "go=false"; fi
            if echo "$FILES" | grep -qE '^apps/web/'; then echo "web=true"; else echo "web=false"; fi
            if echo "$FILES" | grep -qE '^apps/api/|^packages/'; then echo "api=true"; else echo "api=false"; fi
            if echo "$FILES" | grep -qE '^scripts/'; then echo "scripts=true"; else echo "scripts=false"; fi
          } >> "$OUTFILE"

  verify:
    name: Verify merged changes
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Go
        if: needs.detect.outputs.run_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile 2>&1 || echo "bun_install_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify Go build + test
        if: needs.detect.outputs.run_go == 'true'
        id: go-check
        working-directory: apps/cli
        run: |
          O="$GITHUB_OUTPUT"
          go build -buildvcs=false ./... 2>&1 && echo "go_build=pass" >> "$O" || echo "go_build=fail" >> "$O"
          go test -buildvcs=false ./... 2>&1 && echo "go_test=pass" >> "$O" || echo "go_test=fail" >> "$O"

      - name: Verify Web typecheck
        if: needs.detect.outputs.run_web == 'true'
        id: web-check
        working-directory: apps/web
        run: |
          timeout 120 npx tsc -p tsconfig.check.json --noEmit 2>&1 && echo "web_typecheck=pass" >> "$GITHUB_OUTPUT" || echo "web_typecheck=fail" >> "$GITHUB_OUTPUT"

      - name: Verify API typecheck
        if: needs.detect.outputs.run_api == 'true'
        id: api-check
        run: |
          timeout 120 bun run --filter @drenyra/api typecheck 2>&1 && echo "api_typecheck=pass" >> "$GITHUB_OUTPUT" || echo "api_typecheck=fail" >> "$GITHUB_OUTPUT"

      - name: Compile verification report
        id: report
        run: |
          O="$GITHUB_OUTPUT"
          GO_BUILD="${{ steps.go-check.outputs.go_build }}"
          GO_TEST="${{ steps.go-check.outputs.go_test }}"
          WEB_TC="${{ steps.web-check.outputs.web_typecheck }}"
          API_TC="${{ steps.api-check.outputs.api_typecheck }}"

          REPORT="## Post-Merge Verification\n\n**Commit:** ${{ github.sha }}\n\n| Subsystem | Result |\n|-----------|--------|\n"
          [ -n "$GO_BUILD" ] && REPORT+="| Go Build | $GO_BUILD |\n"
          [ -n "$GO_TEST" ] && REPORT+="| Go Test | $GO_TEST |\n"
          [ -n "$WEB_TC" ] && REPORT+="| Web TypeCheck | $WEB_TC |\n"
          [ -n "$API_TC" ] && REPORT+="| API TypeCheck | $API_TC |\n"

          {
            echo "report<<EOF"
            echo -e "$REPORT"
            echo "EOF"
            ALL_PASS=true
            for v in "$GO_BUILD" "$GO_TEST" "$WEB_TC" "$API_TC"; do
              [ "$v" = "fail" ] && ALL_PASS=false
            done
            $ALL_PASS && echo "status=pass" || echo "status=fail"
          } >> "$O"

      - name: Create verification issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.report.outputs.report }}`;
            const status = '${{ steps.report.outputs.status }}';
            const sha = '${{ github.sha }}';

            const issueBody = `## Merge Health — ${sha.slice(0, 7)}\n\n**Status:** ${status === 'pass' ? '✅ Pass' : '❌ Fail'}\n\n${report}\n\n**Created:** ${new Date().toISOString()}\n\n**Verification:** Post-merge auto-check`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'merge-health',
              state: 'open',
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Merge Health — ${sha.slice(0, 7)}`,
                body: issueBody,
                labels: ['merge-health'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: issueBody,
              });
            }

      - name: Create remediation issue on failure
        if: steps.report.outputs.status == 'fail'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[auto] Post-merge check failed — ${{ github.sha }}`.slice(0, 60),
              body: `## ⚠️ Post-Merge Verification Failed\n\nCommit \`${{ github.sha }}\` merged but verification checks failed.\n\n${{ steps.report.outputs.report }}\n\n**Suggested action:** Investigate and fix the failing checks.\n\n_This issue was auto-generated._`,
              labels: ['bug', 'auto-generated'],
            });
