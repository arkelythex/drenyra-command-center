name: Nightly Quality Checks

on:
  schedule:
    # Run every night at 2:00 AM
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Manual trigger

concurrency:
  group: nightly-quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-coverage:
    name: Nightly Coverage Report
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Run full coverage
        run: |
          bun run test:coverage
          
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v6
        with:
          files: |-
            apps/api/coverage/coverage-final.json
            apps/web/coverage/coverage-final.json
          flags: nightly
          
      - name: Comment coverage trend on slack
        if: success()
        run: |
          echo "Coverage trend uploaded to Codecov"
          
  nightly-contracts:
    name: API Contract Tests
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Validate API contracts
        run: |
          bun run --filter @drenyra/api test:contracts
          
  nightly-full-e2e:
    name: Full E2E Suite
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (system deps + browser)
        run: bunx playwright install --with-deps chromium
        
      - name: Start services
        run: |
          bun run dev:stack &
          sleep 30
          
      - name: Run full E2E tests
        run: |
          bunx playwright test --project=chromium
          
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nightly-results
          path: test-results/
          retention-days: 7
          
  nightly-security:
    name: Nightly Security Scan
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Run security audit
        run: |
          bun audit
          
  nightly-summary:
    name: Nightly Summary
    runs-on: [self-hosted, linux, x64]
    needs:
      [
        nightly-coverage,
        nightly-contracts,
        nightly-full-e2e,
        nightly-security,
      ]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🌙 Nightly Quality Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Coverage:** ${{ needs.nightly-coverage.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Contracts:** ${{ needs.nightly-contracts.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**E2E:** ${{ needs.nightly-full-e2e.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Security:** ${{ needs.nightly-security.result }}" >> "$GITHUB_STEP_SUMMARY"