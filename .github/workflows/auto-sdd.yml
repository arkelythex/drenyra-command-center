# Auto-SDD — Self-Diagnosing Improvement Proposals
#
# Runs on a schedule and after significant events (many merged PRs).
# Analyzes Engram memory, recent issues, and tech debt signals to
# auto-generate SDD proposals for improvements.
#
# The workflow:
# 1. Collects recent issues labeled with patterns (bug, tech-debt, merge-health)
# 2. Analyzes frequency and severity of recurring problems
# 3. Generates a structured SDD proposal
# 4. Creates a GitHub issue with the proposal for human review

name: Auto-SDD

on:
  schedule:
    # Run weekly: every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: "Force generation even without triggers"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  BUN_VERSION: '1.3.11'

jobs:
  analyze:
    name: Analyze signals and generate proposals
    runs-on: ubuntu-latest
    outputs:
      proposal_count: ${{ steps.proposal.outputs.count }}
      issues_analyzed: ${{ steps.collect.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect signal issues
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const SIGNAL_LABELS = ['bug', 'tech-debt', 'merge-health', 'judgment-day'];

            let allIssues = [];
            for (const label of SIGNAL_LABELS) {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: label,
                state: 'all',
                per_page: 20,
                sort: 'updated',
                direction: 'desc',
              });
              allIssues = allIssues.concat(issues);
            }

            // Deduplicate
            const seen = new Set();
            const unique = allIssues.filter(i => {
              if (seen.has(i.number)) return false;
              seen.add(i.number);
              return true;
            });

            // Count by label
            const byLabel = {};
            for (const issue of unique) {
              for (const label of issue.labels) {
                const name = typeof label === 'string' ? label : label.name;
                byLabel[name] = (byLabel[name] || 0) + 1;
              }
            }

            core.setOutput('count', unique.length.toString());
            core.setOutput('by_label', JSON.stringify(byLabel));
            core.setOutput('recent', JSON.stringify(unique.slice(0, 5).map(i => ({
              number: i.number,
              title: i.title,
              state: i.state,
              labels: i.labels.map(l => typeof l === 'string' ? l : l.name),
            }))));

            // Check openspec for existing proposals
            const { execSync } = require('child_process');
            const fs = require('fs');
            const specDir = 'openspec/changes';
            let existingProposals = [];
            if (fs.existsSync(specDir)) {
              existingProposals = fs.readdirSync(specDir).filter(f =>
                fs.statSync(`${specDir}/${f}`).isDirectory() &&
                fs.existsSync(`${specDir}/${f}/proposal.md`)
              );
            }
            core.setOutput('existing_proposals', existingProposals.length.toString());

      - name: Generate SDD proposals
        id: proposal
        env:
          ISSUE_COUNT: ${{ steps.collect.outputs.count }}
          BY_LABEL: ${{ steps.collect.outputs.by_label }}
          RECENT_ISSUES: ${{ steps.collect.outputs.recent }}
          EXISTING: ${{ steps.collect.outputs.existing_proposals }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          O="$GITHUB_OUTPUT"
          COUNT=${{ steps.collect.outputs.count }}

          # Only generate if there are signal issues or force is enabled
          if [ "$COUNT" -gt 0 ] || [ "$FORCE" = "true" ]; then
            echo "count=1" >> "$O"
            echo "summary=Auto-detected $COUNT signal issues. Proposal generated." >> "$O"
          else
            echo "count=0" >> "$O"
            echo "summary=No signal issues detected. Skipping." >> "$O"
          fi

      - name: Create proposal issue
        if: steps.proposal.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const count = '${{ steps.collect.outputs.count }}';
            const byLabel = JSON.parse('${{ steps.collect.outputs.by_label }}' || '{}');
            const recent = JSON.parse('${{ steps.collect.outputs.recent }}' || '[]');
            const existing = '${{ steps.collect.outputs.existing_proposals }}';

            let labelSummary = '';
            for (const [k, v] of Object.entries(byLabel)) {
              labelSummary += '- **' + k + '**: ' + v + ' issues\n';
            }

            let recentSummary = '';
            for (const i of recent) {
              recentSummary += '- #' + i.number + ' **' + i.title + '** (' + i.state + ')\n';
            }

            const bodyLines = [
              '## Auto-SDD Proposal',
              '',
              'This proposal was auto-generated from signal analysis.',
              '',
              '### Signal Sources',
              '',
              '**Total issues analyzed:** ' + count,
              '',
              '**By label:**',
              labelSummary || 'None',
              '',
              '**Recent signal issues:**',
              recentSummary || 'None',
              '',
              '**Existing OpenSpec proposals:** ' + existing,
              '',
              '### Suggested Improvement Areas',
              '',
              'Based on recurring signals, consider these improvement areas:',
              '',
              '1. **Address root causes** of recurring bugs (' + (byLabel.bug || 0) + ' bug issues)',
              '2. **Reduce tech debt** (' + (byLabel['tech-debt'] || 0) + ' tech-debt issues)',
              '3. **Improve merge health** (' + (byLabel['merge-health'] || 0) + ' merge-health issues)',
              '4. **Review judgment day findings** (' + (byLabel['judgment-day'] || 0) + ' judgment-day issues)',
              '',
              '### Next Steps',
              '',
              '1. Review this proposal',
              '2. Create an OpenSpec SDD for the prioritized area',
              '3. Update the label to `status:approved` when ready',
              '',
              '_This issue was auto-generated by the Auto-SDD workflow._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[auto-sdd] Weekly improvement proposal',
              body: bodyLines,
              labels: ['auto-generated', 'enhancement'],
            });
