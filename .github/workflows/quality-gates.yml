name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Quality gates for the accounting surface.
#
# These gates run on pull requests so violations are caught BEFORE they land on
# main, and again on push to main as a post-merge safety net for direct pushes
# and admin merges.
#
# Legacy debt is handled with a ratchet, never by disabling a gate:
#   - Lint Check: on pull requests only changed files must be clean.
#   - Fiscal Boundary Check: known violations live in
#     .github/fiscal-gate-baseline.txt and may only be removed.
#   - Security Audit: post-merge only. Pre-merge CVE signal comes from
#     Dependabot alerts, so this stays a tripwire instead of a PR blocker.

jobs:
  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: ./.github/actions/setup-bun
        with:
          verify-native-deps: false

      - name: Lint (full tree, post-merge)
        if: github.event_name != 'pull_request'
        run: |
          bun run lint
          bunx biome check .

      - name: Lint (changed files only)
        if: github.event_name == 'pull_request'
        run: |
          # fetch-depth: 0 already provides full history, so the merge base is
          # available without an extra (and potentially shallow-corrupting) fetch.
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD \
            -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' | tr '\n' ' ')
          if [ -z "${CHANGED// /}" ]; then
            echo "No lintable files changed."
            exit 0
          fi
          echo "Linting: $CHANGED"
          bunx biome check $CHANGED

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: ./.github/actions/setup-bun
        with:
          verify-native-deps: false

      # Policy: block high/critical advisories. Low/moderate ones are tracked in
      # odd/tasks/gentle-ai-v4-migration.md until their upstream fix lands.
      - name: Dependency vulnerability audit (high and critical block)
        run: bun run security:audit

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Ecosystem connection (drenyra-ai contracts frozen, doctor healthy)
        run: bun run ecosystem:doctor

  coverage-check:
    name: Coverage Thresholds
    runs-on: ubuntu-latest
    # Without a bound this job inherits GitHub's 360-minute default, so a slow
    # suite looks like a hang instead of a failure. Fail visibly, not silently.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: ./.github/actions/setup-bun
        with:
          verify-native-deps: false

      - name: Run tests with coverage enforcement
        run: |
          bun run --filter @drenyra/domain test -- --coverage
          bun run --filter @drenyra/api test:run -- --coverage
          bun run --filter @drenyra/web test -- --coverage

  fiscal-boundaries:
    name: Fiscal Boundary Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: ./.github/actions/setup-bun
        with:
          verify-native-deps: false

      # The SIRE-bench regression below shells out to `uv run pytest`. Without
      # this the job died with exit 127 ("uv: command not found") long before
      # anyone could tell whether the fiscal rules passed.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check fiscal boundaries
        uses: ./.github/actions/quality-gate-fiscal
