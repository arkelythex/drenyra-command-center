name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.11'

jobs:
  go:
    name: Go — build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect Go changes
        id: changes
        working-directory: .
        run: |
          files=$(git diff --name-only HEAD^ HEAD || git diff --name-only)
          if echo "$files" | grep -Eq '^apps/cli/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.run == 'true'
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - if: steps.changes.outputs.run == 'true'
        run: go build -buildvcs=false ./...
      - if: steps.changes.outputs.run == 'true'
        run: go test -buildvcs=false ./...

  node-api:
    name: Node — api typecheck
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect API changes
        id: changes
        run: |
          files=$(git diff --name-only HEAD^ HEAD || git diff --name-only)
          if echo "$files" | grep -Eq '^(apps/api/|packages/|tsconfig|package\.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - if: steps.changes.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.run == 'true'
        run: bun run --filter @drenyra/api typecheck

  node-web:
    name: Node — web typecheck
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect web changes
        id: changes
        run: |
          files=$(git diff --name-only HEAD^ HEAD || git diff --name-only)
          if echo "$files" | grep -Eq '^(apps/web/|packages/|tsconfig|package\.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - if: steps.changes.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.run == 'true'
        run: bun run --filter @drenyra/web typecheck

  python:
    name: Python — data-engine lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-engine
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect data-engine changes
        id: changes
        working-directory: .
        run: |
          files=$(git diff --name-only HEAD^ HEAD || git diff --name-only)
          if echo "$files" | grep -Eq '^apps/data-engine/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: '3.12'
      - if: steps.changes.outputs.run == 'true'
        run: pip install uv && uv sync --extra dev
      - if: steps.changes.outputs.run == 'true'
        run: uv run ruff check src/ tests/ --select F821,F822,F823

  domain:
    name: Domain — typecheck + test
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect domain changes
        id: changes
        run: |
          files=$(git diff --name-only HEAD^ HEAD || git diff --name-only)
          if echo "$files" | grep -Eq '^(packages/domain/|packages/application/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - if: steps.changes.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.run == 'true'
        run: bun run --filter @drenyra/domain typecheck
      - if: steps.changes.outputs.run == 'true'
        run: bun run --filter @drenyra/domain test -- --run
    
  wave2-static-gate:
    name: Wave 2 — Static Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Wave 2 Static Gate
        run: bash scripts/gate/wave2-static-gate.sh

  wave2-integration-gate:
    name: Wave 2 — Integration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: w2_gate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli PING"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Wave 2 Integration Gate
        run: bash scripts/gate/wave2-gate.sh
        env:
          DATABASE_URL_TEST: postgresql://user:password@localhost:5432/w2_gate_test
          REDIS_URL: redis://localhost:6379

  quality-checks:
    name: Quality — lint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Forbidden terms
        run: bun run ci:forbidden-terms
