name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  go:
    name: Go — build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/drenyra-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/drenyra-cli/go.mod
          cache-dependency-path: apps/drenyra-cli/go.sum
      - run: go build ./...
      - run: go test ./...

  node-api:
    name: Node — api typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run --filter @arkelythex/api typecheck

  node-web:
    name: Node — web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run --filter @arkelythex/web typecheck

  python:
    name: Python — data-engine lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv && uv sync --frozen
      - run: uv run ruff check src/ tests/
