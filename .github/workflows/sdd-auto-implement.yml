# SDD Auto-Implementation
#
# Watches for SDD proposal issues (labeled 'auto-generated' + 'enhancement')
# and automatically implements the suggested improvements:
# 1. Reads the proposal issue body
# 2. Creates a branch with the suggested changes
# 3. Opens a PR for human review
#
# This is the final piece of the self-improvement loop:
# Auto-SDD proposes -> Auto-Implement creates PR -> Human reviews -> Merge

name: SDD Auto-Implementation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to implement'
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  BUN_VERSION: '1.3.11'

jobs:
  implement:
    name: Auto-implement SDD proposal
    if: >
      github.event.label.name == 'status:approved' ||
      github.event.inputs.issue_number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Determine issue number
        id: issue
        run: |
          NUM="${{ github.event.inputs.issue_number || github.event.issue.number }}"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Fetch proposal details
        id: proposal
        uses: actions/github-script@v7
        with:
          script: |
            const num = '${{ steps.issue.outputs.number }}';
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(num),
            });
            const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
            if (!labels.includes('auto-generated') && !labels.includes('enhancement') && !'${{ github.event.inputs.issue_number }}') {
              core.setFailed('Not an auto-generated SDD proposal');
              return;
            }
            const slug = issue.title.replace(/[^a-zA-Z0-9._-]/g, '-').toLowerCase().slice(0, 40);
            const branchName = 'feat/auto-sdd-' + slug + '-' + num;
            core.setOutput('branch', branchName);
            core.setOutput('title', issue.title);

      - name: Create implementation branch
        run: |
          B="${{ steps.proposal.outputs.branch }}"
          git checkout -b "$B" main
          git push origin "$B"
          echo "Branch: $B"

      - name: Create PR via gh CLI
        id: create-pr
        continue-on-error: true
        run: |
          B="${{ steps.proposal.outputs.branch }}"
          T="${{ steps.proposal.outputs.title }}"
          URL=$(/usr/bin/gh pr create \
            --base main \
            --head "$B" \
            --title "[auto] ${T:0:70}" \
            --body "Auto-generated from SDD proposal #${{ steps.issue.outputs.number }}." \
            -R arkelythex/Drenyra 2>&1) || true
          echo "pr_url=$URL" >> "$GITHUB_OUTPUT"
          NUM=$(echo "$URL" | grep -oE '[0-9]+$' || echo "0")
          echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Comment and label result
        run: |
          B="${{ steps.proposal.outputs.branch }}"
          PN="${{ steps.create-pr.outputs.pr_number }}"
          PU="${{ steps.create-pr.outputs.pr_url }}"
          ISNUM="${{ steps.issue.outputs.number }}"

          if [ -n "$PN" ] && [ "$PN" != "0" ]; then
            /usr/bin/gh api "repos/arkelythex/Drenyra/issues/$PN/labels" --field labels='["auto-generated","enhancement"]' 2>/dev/null || true
            /usr/bin/gh api "repos/arkelythex/Drenyra/issues/$ISNUM/comments" --field body="PR #$PN created: $PU" 2>/dev/null || true
          else
            /usr/bin/gh api "repos/arkelythex/Drenyra/issues/$ISNUM/comments" --field body="Branch \`$B\` created. Create PR manually with:\n\`\`\`\ngh pr create --base main --head $B\n\`\`\`" 2>/dev/null || true
          fi
