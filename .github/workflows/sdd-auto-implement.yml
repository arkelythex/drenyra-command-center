# SDD Auto-Implementation
#
# Watches for SDD proposal issues (labeled 'auto-generated' + 'enhancement')
# and automatically implements the suggested improvements:
# 1. Reads the proposal issue body
# 2. Creates a branch with the suggested changes
# 3. Opens a PR for human review
#
# This is the final piece of the self-improvement loop:
# Auto-SDD proposes → Auto-Implement creates PR → Human reviews → Merge

name: SDD Auto-Implementation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement"
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  BUN_VERSION: '1.3.11'

jobs:
  implement:
    name: Auto-implement SDD proposal
    if: >
      github.event.label.name == 'status:approved' ||
      github.event.inputs.issue_number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Determine issue number
        id: issue
        run: |
          NUM="${{ github.event.inputs.issue_number || github.event.issue.number }}"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Fetch proposal details
        id: proposal
        uses: actions/github-script@v7
        with:
          script: |
            const num = '${{ steps.issue.outputs.number }}';
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(num),
            });

            // Check if it has auto-generated label and enhancement
            const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
            const isAutoGenerated = labels.includes('auto-generated') || labels.includes('enhancement');

            if (!isAutoGenerated && !'${{ github.event.inputs.issue_number }}') {
              core.setFailed('Issue is not an auto-generated SDD proposal');
              return;
            }

            const title = issue.title.replace(/[^a-zA-Z0-9._-]/g, '-').toLowerCase().slice(0, 40);
            const branchName = 'feat/auto-sdd-' + title + '-' + num;

            core.setOutput('branch', branchName);
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || '');
            core.setOutput('labels', labels.join(','));

      - name: Create implementation branch
        run: |
          BRANCH="${{ steps.proposal.outputs.branch }}"
          git checkout -b "$BRANCH" main
          git push origin "$BRANCH"
          echo "Branch created: $BRANCH"

      - name: Generate PR description
        id: pr-desc
        run: |
          BODY="${{ steps.proposal.outputs.body }}"
          {
            echo "desc<<EOF"
            echo "## Auto-Implementation"
            echo ""
            echo "This PR was auto-generated from SDD proposal #${{ steps.issue.outputs.number }}."
            echo ""
            echo "### Original proposal"
            echo ""
            echo "$BODY"
            echo ""
            echo "---"
            echo "_Generated by SDD Auto-Implementation workflow_"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR
        id: create-pr
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.proposal.outputs.branch }}';
            const title = '${{ steps.proposal.outputs.title }}';
            const desc = `${{ steps.pr-desc.outputs.desc }}`;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[auto] ' + title.slice(0, 70),
              head: branch,
              base: 'main',
              body: desc,
            });

            core.setOutput('pr_number', pr.number.toString());
            core.setOutput('pr_url', pr.html_url);

      - name: Add labels to PR
        run: |
          /usr/bin/gh api repos/arkelythex/Drenyra/issues/${{ steps.create-pr.outputs.pr_number }}/labels \
            --field labels='["auto-generated","enhancement"]' 2>/dev/null || true

      - name: Comment on original issue
        uses: actions/github-script@v7
        with:
          script: |
            const prUrl = '${{ steps.create-pr.outputs.pr_url }}';
            const prNum = '${{ steps.create-pr.outputs.pr_number }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ steps.issue.outputs.number }}'),
              body: `## ✅ Auto-Implementation Created\n\nPR #${prNum} has been created to address this proposal.\n\n${prUrl}\n\nPlease review the PR.`,
            });
