# SDD Auto-Implementation with AI Code Generation
#
# Watches for SDD proposal issues (labeled 'auto-generated' + 'enhancement')
# and:
# 1. Reads the proposal issue body
# 2. Calls DeepSeek AI to generate implementation code/files
# 3. Creates a branch with the generated code
# 4. Opens a PR for human review
#
# This closes the loop: proposal -> AI implementation -> PR -> review -> merge

name: SDD Auto-Implementation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to implement'
        required: true
        type: number
      custom_prompt:
        description: 'Optional custom implementation prompt'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  BUN_VERSION: '1.3.11'
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  implement:
    name: AI Auto-implement SDD proposal
    if: >
      github.event.label.name == 'status:approved' ||
      github.event.inputs.issue_number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Determine issue number
        id: issue
        run: |
          NUM="${{ github.event.inputs.issue_number || github.event.issue.number }}"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Fetch proposal details
        id: proposal
        uses: actions/github-script@v7
        with:
          script: |
            const num = '${{ steps.issue.outputs.number }}';
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(num),
            });
            const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
            if (!labels.includes('auto-generated') && !labels.includes('enhancement') && !'${{ github.event.inputs.issue_number }}') {
              core.setFailed('Not an auto-generated SDD proposal');
              return;
            }
            const slug = issue.title.replace(/[^a-zA-Z0-9._-]/g, '-').toLowerCase().slice(0, 40);
            const branchName = 'feat/auto-sdd-' + slug + '-' + num;
            core.setOutput('branch', branchName);
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || 'No body');
            core.setOutput('slug', slug);

      - name: Generate implementation via DeepSeek
        id: generate
        env:
          PROPOSAL_BODY: ${{ steps.proposal.outputs.body }}
          PROPOSAL_TITLE: ${{ steps.proposal.outputs.title }}
          CUSTOM_PROMPT: ${{ github.event.inputs.custom_prompt }}
        run: |
          mkdir -p output
          TIMESTAMP=$(date -Iseconds)

          # Build the AI prompt from the proposal
          cat > /tmp/ai-prompt.json << 'JSONEOF'
          {
            "model": "deepseek-chat",
            "messages": [
              {
                "role": "system",
                "content": "You are an AI that generates code files. Output ONLY a valid JSON object where keys = file paths, values = complete file contents. NO markdown, NO explanations, NO code blocks. Start with { and end with }. Use TypeScript for web, Go for CLI."
              },
              {
                "role": "user",
                "content": "Implement the following SDD proposal:\n\nTitle: ${{ steps.proposal.outputs.title }}\n\nBody:\n${{ steps.proposal.outputs.body }}\n\n${{ github.event.inputs.custom_prompt && format('Additional instructions: {0}', github.event.inputs.custom_prompt) || '' }}\n\nGenerate implementation files that address the proposal's suggestions."
              }
            ],
            "temperature": 0.3,
            "max_tokens": 4000
          }
          JSONEOF

          echo "Calling DeepSeek API..."
          RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -d @/tmp/ai-prompt.json 2>&1) || echo "API_CALL_FAILED=true"

          echo "API Response received: $(echo "$RESPONSE" | wc -c) bytes"

          # Extract the generated files
          echo "$RESPONSE" > /tmp/ai-response.json
          echo "api_response_saved=true"

      - name: Process AI response and write files
        run: |
          if [ -f /tmp/ai-response.json ]; then
            python3 scripts/ci/parse-ai-response.py /tmp/ai-response.json output 2>&1 || echo "PARSE_FAILED=true"
          fi
          echo "Generated files:"
          find output -type f 2>/dev/null | sort || echo "No files generated"

      - name: Commit generated code and create branch
        run: |
          B="${{ steps.proposal.outputs.branch }}"

          # Create branch from main
          git checkout -b "$B" main

          # Copy generated files
          if [ -d output ] && [ "$(find output -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            cp -r output/* . 2>/dev/null || true
            rm -rf output
            git add -A
            git stash 2>/dev/null || true
            # Use direct git plumbing to commit
            TREE=$(git write-tree 2>/dev/null) || git add -A && TREE=$(git write-tree)
            if [ -n "$TREE" ]; then
              COMMIT=$(echo "feat: auto-implement SDD proposal #${{ steps.issue.outputs.number }}

              Auto-generated implementation from SDD proposal.
              Generated by AI via DeepSeek." | git commit-tree "$TREE" -p HEAD)
              git update-ref HEAD "$COMMIT" 2>/dev/null
            fi
            git push origin "$B" --force 2>&1 | tail -3
            echo "Files committed and pushed"
          else
            echo "No files generated by AI. Pushing empty branch."
            git push origin "$B" 2>&1 | tail -3
          fi

      - name: Create PR
        id: create-pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          B="${{ steps.proposal.outputs.branch }}"
          T="${{ steps.proposal.outputs.title }}"
          HAS_FILES=$(find . -maxdepth 1 -name "*.md" -o -name "*.ts" -o -name "*.tsx" 2>/dev/null | head -1)

          if [ -n "$HAS_FILES" ] || [ "$(git rev-list --count main..HEAD 2>/dev/null || echo 0)" -gt 0 ]; then
            URL=$(/usr/bin/gh pr create \
              --base main \
              --head "$B" \
              --title "[auto] ${T:0:70}" \
              --body "## Auto-Implementation\n\nThis PR was auto-generated from SDD proposal #${{ steps.issue.outputs.number }}.\n\n**Implementation generated by AI (DeepSeek).**\n\nPlease review the changes carefully before merging.\n\n---\n_Generated by SDD Auto-Implementation workflow_" \
              -R arkelythex/Drenyra 2>&1) || true
            echo "pr_url=$URL" >> "$GITHUB_OUTPUT"
            NUM=$(echo "$URL" | grep -oE '[0-9]+$' || echo "0")
            echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit. Skipping PR creation."
          fi

      - name: Comment and label result
        run: |
          B="${{ steps.proposal.outputs.branch }}"
          PN="${{ steps.create-pr.outputs.pr_number }}"
          PU="${{ steps.create-pr.outputs.pr_url }}"
          ISNUM="${{ steps.issue.outputs.number }}"

          if [ -n "$PN" ] && [ "$PN" != "0" ]; then
            /usr/bin/gh api "repos/arkelythex/Drenyra/issues/$PN/labels" \
              --field labels='["auto-generated","enhancement"]' 2>/dev/null || true
            /usr/bin/gh api "repos/arkelythex/Drenyra/issues/$ISNUM/comments" \
              --field body="## Auto-Implementation Completed\n\nPR #$PN has been created with AI-generated implementation.\n\n$PU\n\nPlease review the PR." 2>/dev/null || true
          else
            /usr/bin/gh api "repos/arkelythex/Drenyra/issues/$ISNUM/comments" \
              --field body="## Auto-Implementation Attempted\n\nBranch \`$B\` was created but no PR was generated (no code changes or API unavailable).\n\nTo create PR manually:\n\`\`\`\ngh pr create --base main --head $B\n\`\`\`" 2>/dev/null || true
          fi
