# SDD Auto-Implementation
#
# Watches for SDD proposal issues (labeled 'auto-generated' + 'enhancement')
# and automatically implements the suggested improvements:
# 1. Reads the proposal issue body
# 2. Creates a branch with the suggested changes
# 3. Opens a PR for human review
#
# This is the final piece of the self-improvement loop:
# Auto-SDD proposes → Auto-Implement creates PR → Human reviews → Merge

name: SDD Auto-Implementation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to implement'
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  BUN_VERSION: '1.3.11'

jobs:
  implement:
    name: Auto-implement SDD proposal
    if: >
      github.event.label.name == 'status:approved' ||
      github.event.inputs.issue_number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Determine issue number
        id: issue
        run: |
          NUM="${{ github.event.inputs.issue_number || github.event.issue.number }}"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Fetch proposal details
        id: proposal
        uses: actions/github-script@v7
        with:
          script: |
            const num = '${{ steps.issue.outputs.number }}';
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(num),
            });

            const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
            const isAutoGenerated = labels.includes('auto-generated') || labels.includes('enhancement');

            if (!isAutoGenerated && !'${{ github.event.inputs.issue_number }}') {
              core.setFailed('Issue is not an auto-generated SDD proposal');
              return;
            }

            const titleSlug = issue.title.replace(/[^a-zA-Z0-9._-]/g, '-').toLowerCase().slice(0, 40);
            const branchName = 'feat/auto-sdd-' + titleSlug + '-' + num;

            core.setOutput('branch', branchName);
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || '');

      - name: Create implementation branch
        run: |
          BRANCH="${{ steps.proposal.outputs.branch }}"
          git checkout -b "$BRANCH" main
          git push origin "$BRANCH"
          echo "Branch created: $BRANCH"

      - name: Create PR via gh CLI
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.proposal.outputs.branch }}"
          TITLE="[auto] ${{ steps.proposal.outputs.title }}"
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" << 'BODYEOF'
          ## Auto-Implementation

          This PR was auto-generated from SDD proposal #${{ steps.issue.outputs.number }}.

          ### Original proposal

          ${{ steps.proposal.outputs.body }}

          ---
          _Generated by SDD Auto-Implementation workflow_
          BODYEOF

          PR_URL=$(/usr/bin/gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "${TITLE:0:70}" \
            --body "Auto-generated from SDD proposal #${{ steps.issue.outputs.number }}." \
            -R arkelythex/Drenyra 2>&1)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          # Extract PR number from URL
          PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "PR: $PR_URL"

      - name: Add labels to PR
        if: steps.create-pr.outputs.pr_number != ''
        run: |
          /usr/bin/gh api repos/arkelythex/Drenyra/issues/${{ steps.create-pr.outputs.pr_number }}/labels \
            --field labels='["auto-generated","enhancement"]' 2>/dev/null || true

      - name: Comment on original issue
        if: steps.create-pr.outputs.pr_number != ''
        run: |
          PR_NUM="${{ steps.create-pr.outputs.pr_number }}"
          PR_URL="${{ steps.create-pr.outputs.pr_url }}"
          /usr/bin/gh api repos/arkelythex/Drenyra/issues/${{ steps.issue.outputs.number }}/comments \
            --field body="## Auto-Implementation Created\n\nPR #${PR_NUM} has been created.\n\n${PR_URL}\n\nPlease review the PR." 2>/dev/null || true
