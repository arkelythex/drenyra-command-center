name: Quality Gates (Self-Hosted Pilot)

on:
  workflow_dispatch:
  push:
    branches:
      - ci/self-hosted-quality-gates-pilot

permissions:
  contents: read

concurrency:
  group: quality-gates-self-hosted-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-preflight:
    name: Runner Preflight
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show runner context
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          echo "GitHub ref: $GITHUB_REF"

      - name: Verify Linux toolchain baseline
        run: |
          missing_tools=()
          command -v rg >/dev/null 2>&1 || missing_tools+=(ripgrep)
          if ! command -v fd >/dev/null 2>&1 && ! command -v fdfind >/dev/null 2>&1; then
            missing_tools+=(fd-find)
          fi
          command -v bc >/dev/null 2>&1 || missing_tools+=(bc)

          if [ "${#missing_tools[@]}" -gt 0 ]; then
            if sudo -n true >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y "${missing_tools[@]}"
            else
              echo "Missing required tools: ${missing_tools[*]}"
              echo "Runner has no passwordless sudo, so install them manually before rerunning the pilot."
              exit 1
            fi
          fi

          rg --version
          fd --version || fdfind --version
          bc --version | head -n 1

      - name: Verify Bun install and lockfile resolution
        run: |
          bun --version
          bun install --frozen-lockfile

      - name: Report Docker availability for future CI migration
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker --version
          else
            echo "Docker is not installed on this runner yet"
          fi

  typecheck:
    name: TypeScript Check (Pilot)
    runs-on: [self-hosted, linux, x64]
    needs: runner-preflight

    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeCheck
        run: |
          bunx --package typescript@5.8.2 tsc -p tsconfig.check.json

  biome-check:
    name: Biome Format & Lint (Pilot)
    runs-on: [self-hosted, linux, x64]
    needs: runner-preflight

    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Biome Check
        run: |
          bunx --package @biomejs/biome@2.3.11 biome check --diagnostic-level=warn . || {
            echo "⚠️  Biome formatting/linting issues found"
            echo "Run: bunx biome check --write --unsafe"
          }

  security-check:
    name: Security Audit (Pilot)
    runs-on: [self-hosted, linux, x64]
    needs: runner-preflight

    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Security Audit
        run: |
          echo "🔒 Running security audit..."

          echo "Checking for hardcoded secrets..."
          if grep -r "password.*=.*['\"]" --include="*.ts" --include="*.js" apps/ | grep -v "process.env" | grep -v "placeholder"; then
            echo "⚠️  Potential hardcoded passwords detected (review required)"
          fi

          echo "Checking for SQL injection risks..."
          if grep -r "db.execute.*\${" --include="*.ts" apps/api/ 2>/dev/null; then
            echo "⚠️  Warning: Potential SQL injection risk (template literals in queries)"
          fi

          echo "Checking for console.logs..."
          console_count=$(grep -r "console\\.log" --include="*.ts" apps/api/src/features/ | wc -l)
          if [ "$console_count" -gt 10 ]; then
            echo "⚠️  Warning: Found $console_count console.log statements"
            echo "Use SecureLogger instead for production code"
          fi

          echo "✅ Security check completed"

  performance-check:
    name: Performance Metrics (Pilot)
    runs-on: [self-hosted, linux, x64]
    needs: runner-preflight

    steps:
      - name: Install git-lfs
        run: |
          mkdir -p ~/.local/bin
          curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
          cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
          ~/.local/bin/git-lfs install --skip-repo --force
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check File Sizes
        run: |
          echo "📊 Checking file sizes..."

          large_files=$(find apps/api/src/features -name "*.ts" -type f -exec wc -l {} + | awk '$1 > 200 {print $2, "("$1" lines)"}')

          if [ -n "$large_files" ]; then
            echo "⚠️  Files exceeding 200 lines (project rule):"
            echo "$large_files"
          else
            echo "✅ All files within 200 line limit"
          fi

      - name: Check Bundle Size (if applicable)
        run: |
          echo "📦 Estimating module complexity..."

          total_lines=$(find apps/api/src/features -name "*.ts" -type f -exec wc -l {} + | tail -1 | awk '{print $1}')
          echo "Total lines in features: $total_lines"

          feature_count=$(find apps/api/src/features -maxdepth 1 -type d | wc -l)
          echo "Number of features: $feature_count"

          if [ "$feature_count" -gt 0 ]; then
            avg_lines=$((total_lines / feature_count))
            echo "Average lines per feature: $avg_lines"
          fi

  summary:
    name: Quality Summary (Pilot)
    runs-on: [self-hosted, linux, x64]
    needs: [typecheck, biome-check, security-check, performance-check]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "## 📊 Quality Gates Summary (Self-Hosted Pilot)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow validates whether the repository can execute quality gates on a Linux x64 self-hosted runner." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Pilot goals:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verify runner connectivity and Bun bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verify the current quality-gates workflow can run without GitHub-hosted billing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Capture whether the runner is ready for a broader CI migration" >> "$GITHUB_STEP_SUMMARY"