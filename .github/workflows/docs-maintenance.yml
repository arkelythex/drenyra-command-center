name: Docs Maintenance

on:
  push:
    branches: [main]
    paths: ['docs/**', '*.md', 'scripts/docs/**']
  pull_request:
    paths: ['docs/**', '*.md', 'scripts/docs/**']
  schedule:
    # Run weekly to catch stale links and freshness issues
    - cron: '0 6 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Generate index
        run: bun run codebase:index
          
      - name: Check internal links
        run: bun run docs:check-links
          
      - name: Check all links (full scan)
        # Full-scan debt: 218 pre-existing broken links across .github/, ops/, apps/, packages/
        # (docs cleanup 0fa3cb70d removed targets but not the references). Diagnostic only;
        # the core check above remains the gate. Fix the debt in a dedicated cleanup PR.
        continue-on-error: true
        run: bun run docs:check-links --full
          
      - name: Verify index matches structure
        run: |
          # Re-run generation and check if anything changed
          bun run codebase:index
          if ! git diff --quiet docs/00-INDEX.md; then
            echo "❌ docs/00-INDEX.md is out of date. Run 'bun run codebase:index' and commit."
            exit 1
          fi
          echo "✅ docs/00-INDEX.md is current"
