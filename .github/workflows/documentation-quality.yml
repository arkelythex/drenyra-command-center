name: Documentation Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-lint:
    name: Documentation Linting
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Ensure git-lfs binary available
        run: |
          if ! command -v git-lfs &>/dev/null; then
            mkdir -p ~/.local/bin
            curl -sL "https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-amd64-v3.6.1.tar.gz" | tar -xz -C /tmp
            cp /tmp/git-lfs-3.6.1/git-lfs ~/.local/bin/
            chmod +x ~/.local/bin/git-lfs
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: false
      - name: Remove broken husky hooks
        run: rm -rf .git/hooks .husky/_/

      - name: Verify Bun runtime
        run: |
          command -v bun
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check critical documentation files
        run: |
          echo "📝 Checking critical documentation files..."
          test -f docs/00-INDEX.md || { echo "❌ docs/00-INDEX.md missing"; exit 1; }
          test -f CHANGELOG.md || { echo "❌ CHANGELOG.md missing"; exit 1; }
          echo "✅ All critical documentation files exist"

      - name: Check Mermaid Syntax
        run: |
          echo "🔍 Checking Mermaid diagrams..."
          # Simple check for mermaid blocks
          MERMAID_COUNT=$(grep -r '```mermaid' docs/ apps/api/src/features/ | wc -l)
          echo "Found $MERMAID_COUNT Mermaid diagrams"
          if [ "$MERMAID_COUNT" -lt 15 ]; then
            echo "⚠️  Warning: Expected at least 15 Mermaid diagrams, found $MERMAID_COUNT"
          else
            echo "✅ Mermaid diagrams count looks good"
          fi

      - name: Check Feature READMEs
        run: |
          echo "📚 Checking feature READMEs..."
          MISSING_READMES=0
          for dir in apps/api/src/features/*/; do
            if [ ! -f "${dir}README.md" ]; then
              echo "⚠️  Missing README in ${dir}"
              MISSING_READMES=$((MISSING_READMES + 1))
            fi
          done

          if [ $MISSING_READMES -gt 0 ]; then
            echo "⚠️  Warning: $MISSING_READMES features missing READMEs"
          else
            echo "✅ All features have READMEs"
          fi
